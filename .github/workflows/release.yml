# Publishes the MCP server to npm as @spicrawl/mcp.
#
# Auth is the NPM_TOKEN repository secret: an npm granular access token for
# the spicrawl account with "Read and write (publish and stage)" on @spicrawl
# packages and "Bypass two-factor authentication". Write tokens expire (90
# days at most), so rotate the secret before then. npm ends direct token
# publishing in January 2027; switch to trusted publishing (OIDC) before then.
#
# Each publish is followed by a vX.Y.Z tag on the published commit and a
# GitHub release whose notes are that version's section of CHANGELOG.md.
#
# The repo is public, so each release carries a provenance attestation. The
# attestation needs package.json "repository" to match this GitHub repo.
#
# Release: bump "version" in package.json (and package-lock.json, with
# `npm version --no-git-tag-version X.Y.Z`), add a "## X.Y.Z — date" section
# to CHANGELOG.md, then merge to main. The server reads its version from
# package.json at runtime; the npm version hook also updates server.json. The CI publishes
# that version if npm does not have it yet, and otherwise only runs the
# checks. A prerelease version (e.g. 0.2.0-beta.1) is published under the
# `next` dist-tag so `npx -y @spicrawl/mcp` keeps getting latest.
#
# Triggers: `push` to main, `pull_request`, and `workflow_dispatch`. Every
# step through "already on npm?" runs on all triggers. The publish step runs
# only when the version is new, the event is a push to main (not a PR), and
# this is the main branch. ci.yml runs the same checks on Node 20 and 22.

name: release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # the tag and GitHub release
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: https://registry.npmjs.org
      - name: install
        run: npm ci --no-audit --no-fund
      - name: validate MCP registry manifest
        run: npm run registry:validate
      - name: typecheck
        run: npm run typecheck
      # Builds dist/ and runs the suite against it.
      - name: test
        run: npm test
      # What `npx -y @spicrawl/mcp` will run: the packed tarball must expose a
      # bin npx can pick and report this version.
      - name: package runs
        run: |
          npm pack --silent
          version="$(node -p 'require("./package.json").version')"
          got="$(npx --yes "./spicrawl-mcp-$version.tgz" --version)"
          [ "$got" = "$version" ] || { echo "::error::npx printed '$got', want '$version'"; exit 1; }
          rm -f "./spicrawl-mcp-$version.tgz"
      - name: already on npm?
        id: check
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published; nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          tag=latest
          case "$version" in *-*) tag=next ;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: publish
        if: steps.check.outputs.publish == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::the NPM_TOKEN repository secret is not set"
            exit 1
          fi
          npm publish --provenance --access public --tag "${{ steps.check.outputs.tag }}"
      - name: GitHub release
        if: steps.check.outputs.publish == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          # This version's section of CHANGELOG.md: from its "## X.Y.Z" heading
          # to the next "## " heading.
          awk -v v="$version" 'index($0, "## " v " ") == 1 { f = 1; next } f && /^## / { exit } f' \
            CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || echo "Published @spicrawl/mcp@$version to npm." > "$RUNNER_TEMP/notes.md"
          flags=()
          case "$version" in *-*) flags+=(--prerelease) ;; esac
          gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" \
            --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"

  # Run here, not on the tag/release created above: events created with
  # GITHUB_TOKEN do not start a second workflow. Reruns also repair a missing
  # registry entry when this version is already on npm.
  registry:
    needs: npm
    if: github.repository == 'OfficialSpicrawl/mcp' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # short-lived GitHub OIDC; no registry secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: validate MCP registry manifest
        run: npm run registry:validate
      - name: verify npm package and check registry version
        id: registry
        run: node scripts/registry.mjs check
      - name: install official MCP publisher
        if: steps.registry.outputs.publish == 'true'
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mcp-publisher"
          cd "$RUNNER_TEMP/mcp-publisher"
          base="https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION"
          curl --fail --silent --show-error --location --retry 3 "$base/mcp-publisher_linux_amd64.tar.gz" -o mcp-publisher_linux_amd64.tar.gz
          curl --fail --silent --show-error --location --retry 3 "$base/registry_${MCP_PUBLISHER_VERSION#v}_checksums.txt" -o checksums.txt
          sha256sum --check --ignore-missing checksums.txt
          tar xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
      - name: authenticate and publish to MCP Registry
        if: steps.registry.outputs.publish == 'true'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/mcp-publisher/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher/mcp-publisher" publish server.json
